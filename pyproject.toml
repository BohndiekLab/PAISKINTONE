[project]
name = "paiskintone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alphashape>=1.3.1",
    "color-science>=0.4.5",
    "colour-science>=0.4.6",
    "descartes>=1.1.0",
    "image-similarity-measures>=0.3.5",
    "ipywidgets>=8.1.5",
    "jaxdf>=0.2.8",
    "jinja2>=3.1.6",
    "jwave>=0.2.1",
    "loess>=2.1.2",
    "openpyxl>=3.1.5",
    "paiskintonetools",
    "palettable>=3.3.3",
    "patato>=0.6.0",
    "pint>=0.25.3",
    "pyarrow>=19.0.1",
    "scienceplots>=2.1.1",
    "scikit-image>=0.25.2",
    "seaborn>=0.13.2",
    "shapelysmooth>=0.2.1",
    "statsmodels>=0.14.5",
]

[project.optional-dependencies]
cuda12 = [
    "jax[cuda12]>=0.9.2",
]

[tool.uv.sources]
paiskintonetools = { path = "PAISKINTONETools/paiskintonetools", editable = true }
jwave = { git = "https://github.com/ucl-bug/jwave" }

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "jupyterlab>=4.5.7",
    "pre-commit>=4.1.0",
]
